<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">
    <title>ホテルニューイタヤ サイネージ管理</title>
    <link rel="stylesheet" href="./styles.css?v=20260814-02">
  </head>
  <body class="auth-locked" data-admin-screen="venue-auto" data-admin-page="venue-auto">
    <main id="loginApp" class="login-app" aria-label="Login">
      <form id="loginForm" class="login-panel">
        <img class="login-logo" src="./assets/logo_itaya.png" alt="HOTEL NEW ITAYA">
        <h1>Signage CMS Login</h1>
        <label>
          <span>Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
        </label>
        <p id="loginError" class="login-error" role="alert"></p>
        <button type="submit">Login</button>
      </form>
    </main>

    <main id="adminApp" class="admin-app" aria-label="CMS管理画面">
      <header class="admin-header">
        <div>
          <p class="eyebrow">DIGITAL SIGNAGE CMS PROTOTYPE</p>
          <h1>ホテルニューイタヤ 表示管理</h1>
        </div>
        <img class="admin-logo" src="./assets/logo_itaya.png" alt="HOTEL NEW ITAYA">
      </header>

      <nav class="admin-nav" aria-label="Admin navigation">
        <a data-admin-nav="venue" href="./index.html">会場</a>
        <a data-admin-nav="venue-auto" href="./admin-venue-auto.html">会場（自動）</a>
        <a data-admin-nav="ad1" href="./admin-ad1.html">広告①</a>
        <a data-admin-nav="ad2" href="./admin-ad2.html">広告②</a>
        <a data-admin-nav="menu" href="./admin-menu.html">マーブル①</a>
        <a data-admin-nav="marble" href="./admin-marble.html">マーブル②</a>
        <a data-admin-nav="report" href="./report.html">帳票出力</a>
        <a class="admin-nav-manual" href="./itaya_signage_manual.pdf" target="_blank" rel="noopener">操作マニュアル</a>
      </nav>

      <section class="admin-layout">
        <div class="admin-controls">
          <section class="panel" data-admin-panel="venue-auto">
            <div class="panel-title">
              <div>
                <p class="panel-kicker">Admin 05</p>
                <h2>会場（自動）</h2>
              </div>
              <a class="ghost-link" data-view-link href="./venue-auto.html" target="_blank">表示画面</a>
            </div>
            <p class="panel-note">TableCheckから取得した予約情報を表示します。APIキーはサーバー側の設定ファイルで保持し、ブラウザには表示しません。</p>

            <div class="event-tools">
              <label>
                <span>プレビュー日付</span>
                <input id="autoPreviewDate" type="date">
              </label>
              <label>
                <span>プレビュー時刻</span>
                <input id="autoPreviewTime" type="time">
              </label>
              <button id="syncTableCheck" type="button">TableCheckから取得</button>
              <span id="tablecheckSyncStatus" class="tablecheck-sync-message" aria-live="polite"></span>
            </div>

            <div class="tablecheck-status">
              <div class="tablecheck-status-item">
                <span>最終取得</span>
                <strong id="tablecheckSyncedAt">-</strong>
              </div>
              <div class="tablecheck-status-item">
                <span>取得件数</span>
                <strong id="tablecheckEventCount">0</strong>
              </div>
              <div class="tablecheck-status-item">
                <span>状態</span>
                <strong id="tablecheckStateLabel">未取得</strong>
              </div>
            </div>

            <div id="tablecheckDateTabs" class="venue-date-tabs" role="tablist" aria-label="TableCheck会場案内の日付"></div>
            <div id="tablecheckEventList" class="event-list"></div>
          </section>
        </div>

        <aside class="preview-panel" aria-label="表示プレビュー">
          <div class="preview-toolbar">
            <div>
              <p class="panel-kicker">50 inch portrait preview</p>
              <h2>表示プレビュー</h2>
            </div>
          </div>
          <div id="screenPreview" class="monitor-preview"></div>
        </aside>
      </section>
    </main>

    <main id="viewerApp" class="viewer-app" aria-label="サイネージ表示画面"></main>
    <script src="./tablecheck.js?v=20260814-02"></script>
  </body>
</html>
